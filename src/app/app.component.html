<div class="app-container">
  <app-header *ngIf="showHeaderAndFooter" [showCustomButtons]="showCustomHeaderButtons" [showLangButton]="showCustomLangButton" class="app-header"></app-header>

  <div class="scrollbar-custom app-main">
    <div class="app-body">
      <app-sidebar *ngIf="showSidebar" class="app-sidebar"></app-sidebar>
      
      <main class="app-content " [ngClass]="{ 'auth-bg': isCurrentRoute(['/login', '/']) }">
        <app-chat-bot></app-chat-bot>
        <router-outlet></router-outlet>
      </main>
  </div>
  <app-footer *ngIf="showHeaderAndFooter" class="ap p-footer"></app-footer>
</div>


  <div class="toast-container p-3 position-fixed bottom-0 end-0" style="z-index: 9999;">
    <div
      #liveToast
      class="toast"
      role="alert"
      aria-live="assertive"
      aria-atomic="true"
      data-bs-delay="4000"
    >
      <div class="toast-header bg-info text-white">
        <strong class="me-auto">Notification</strong>
        <small class="text-muted">Just now</small>
        <button
          type="button"
          class="btn-close btn-close-white ms-2 mb-1"
          data-bs-dismiss="toast"
          aria-label="Close"
        ></button>
      </div>
      <div class="toast-body">This is a toast message.</div>
    </div>
  </div>
</div>
