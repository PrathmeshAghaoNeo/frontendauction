<div class="container my-4">
 
    <ng-container *ngFor="let asset of featuredAssets">
        <!-- <p>featured-assets works!</p> -->
        <div class="card">
          <5img [src]="asset.imageUrl" alt="{{ asset.name }}" class="card-img-top">
          <div class="card-body">
            <h5 class="card-title">{{ asset.name }}</h5>
            <p class="card-text">{{ asset.description }}</p>
          </div>
        </div>
    </ng-container>
</div>
