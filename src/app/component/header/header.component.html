<header class="navbar navbar-expand-lg navbar-light bg-light border-bottom rounded">
  <div class="container-fluid">
    <a class="navbar-brand" href="/">
      <img src="/assets/mazadlogo.png" alt="Admin Logo" height="40" class="d-inline-block align-top rounded" />
    </a>

    <div class="d-flex align-items-center">

      <!-- 🎯 Custom Register User Landing Page Buttons -->
      <ng-container *ngIf="showCustomButtons">
        <!-- Cart Button -->
        <button class="icon-btn btn-light me-2" type="button" (click)="toCart()" title="Cart">
          <i class="bi bi-cart fs-5"></i>
        </button>

        <!-- Watchlist Button -->
        <button class="icon-btn btn-light me-2" type="button" (click)="toWatchlist()" title="Watchlist">
          <i class="bi bi-bookmark-heart fs-5"></i>
        </button>

        <!-- Bid Button (replacing image with SVG or use same class) -->
        <button class="icon-btn btn-light me-2" title="Bid" (click)="navigatetoallthebidsbythatuser()">
          <img src="Bidauction1.png" alt="Bid" class="icon-img" />
        </button>

        <!-- Profile Button -->
        <button class="icon-btn btn-light me-2" type="button" (click)="navigateToUserProfile()" title="Profile">
          <i class="bi bi-person-circle fs-5"></i>
        </button>


        <!-- <button class="icon-btn me-2" type="button" (click)="navigateToUserProfile()"
          title="View Profile">
          <img [src]="userProfileImageUrl" alt="User"
            (error)="userProfileImageUrl = 'assets/images/default-profile.jpg'" class="rounded-circle shadow-sm"
            style="height: 40px; width: 40px; object-fit: cover;" />
        </button> -->


        <button class="btn btn-outline-danger rounded-pill" (click)="logout()">
          <i class="bi bi-box-arrow-right me-1"></i>Logout
        </button>
      </ng-container>

      <!-- 🌐 Default Header Buttons -->
      <ng-container *ngIf="showDefaultButtons">
        <div class="dropdown me-2" *ngIf="isLoggedIn">
          <div class="dropdown-menu dropdown-menu-end">
            <button class="dropdown-item btn-outline-secondary" routerLink="/newUser">New User</button>
            <button class="dropdown-item btn-outline-secondary" routerLink="/newAuction">New Auction</button>
            <button class="dropdown-item btn-outline-secondary" routerLink="/newAsset">New Asset</button>
          </div>
        </div>

        <div class="dropdown position-relative me-2" *ngIf="isLoggedIn">
          <button class="btn bell-wrapper shadow-sm border-0 text-purple rounded-bell" (click)="loadNotifications()">
            <i class="bi bi-bell fs-4"></i>
            <span *ngIf="unseenWinDetails.length > 0" class="badge bg-danger rounded-pill">
              {{ unseenWinDetails.length }}
            </span>
          </button>
        </div>

        <button class="btn btn-outline-secondary rounded-circle me-2" routerLink="/settings" *ngIf="isLoggedIn">
          <i class="bi bi-gear"></i>
        </button>

        <button *ngIf="isLoggedIn" class="btn btn-outline-danger rounded-pill" (click)="logout()">
          <i class="bi bi-box-arrow-right me-1"></i>Logout
        </button>

        <button *ngIf="!isLoggedIn" class="btn btn-outline-dark rounded-pill" routerLink="/login">
          <i class="bi bi-person-circle me-1"></i>Login
        </button>
      </ng-container>
    </div>
  </div>
</header>
