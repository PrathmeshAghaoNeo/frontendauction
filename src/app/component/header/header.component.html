<header
  class="navbar navbar-expand-lg navbar-light bg-light border-bottom rounded"
>
  <div class="container-fluid">
    <a
      class="navbar-brand d-flex align-items-center gap-2 flex-wrap"
      [routerLink]="homeRoute"
    >
      <img
        src="/assets/mazadlogo.png"
        alt="Mazad Logo"
        height="40"
        class="rounded"
      />

      <div class="text-container-h brand-text flex flex-column flex-wrap">
        <p class="brand-title mb-0">Auction Management Platform</p>
        <p class="brand-subtitle mb-0">
          A secure, transparent platform for conducting
        </p>
        <p class="brand-subtitle mb-0">
           Electronic Auctions by Government
        </p>
      </div>
    </a>

    <!-- <h3 class="mb-0 text-purple fw-bold typing-title">
      AUCTION MANAGEMENT PLATFORM
    </h3> -->

    <!-- Sidebar Toggle Icon
    <button class="btn btn-link sidebar-toggle" (click)="onToggleSidebar()">
      <i class="bi bi-list" style="font-size: 1.5rem;"></i>
    </button> -->

    <div class="d-flex align-items-center">
      <!-- Custom Register User Landing Page Buttons -->
      <ng-container *ngIf="showCustomButtons">
        <!-- Cart Button -->
        <button
          class="icon-btn btn-light me-2"
          type="button"
          (click)="toCart()"
          [title]="'CART' | translate"
        >
          <i class="bi bi-cart fs-5"></i>
        </button>

        <!-- Watchlist Button -->
        <button
          class="icon-btn btn-light me-2"
          type="button"
          (click)="toWatchlist()"
          [title]="'WATCHLIST' | translate"
        >
          <i class="bi bi-bookmark-heart fs-5"></i>
        </button>

        <!-- Bid Button -->
        <button
          class="icon-btn btn-light me-2"
          type="button"
          (click)="navigatetoallthebidsbythatuser()"
          [title]="'BID' | translate"
        >
          <img src="Bidauction1.png" alt="Bid" class="icon-img" />
        </button>

        <!-- Profile Button -->
        <button
          class="icon-btn btn-light me-2 position-relative"
          type="button"
          (click)="navigateToUserProfile()"
          [title]="'PROFILE' | translate"
        >
          <i class="bi bi-person-circle fs-5"></i>
          <span
            *ngIf="unreadCount > 0"
            class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
          >
            {{ unreadCount }}
          </span>
        </button>

        <!-- Logout Button -->
        <button class="btn btn-outline-danger rounded-pill" (click)="logout()">
          <i class="bi bi-box-arrow-right me-1"></i> {{ "LOGOUT" | translate }}
        </button>
      </ng-container>

      <!-- 🌐 Default Header Buttons -->
      <ng-container *ngIf="showDefaultButtons">
        <div class="dropdown me-2" *ngIf="isLoggedIn">
          <div class="dropdown-menu dropdown-menu-end">
            <button
              class="dropdown-item btn-outline-secondary"
              routerLink="/newUser"
            >
              {{ "NEW_USER" | translate }}
            </button>
            <button
              class="dropdown-item btn-outline-secondary"
              routerLink="/newAuction"
            >
              {{ "NEW_AUCTION" | translate }}
            </button>
            <button
              class="dropdown-item btn-outline-secondary"
              routerLink="/newAsset"
            >
              {{ "NEW_ASSET" | translate }}
            </button>
          </div>
        </div>

        <!-- Logout -->
        <button
          *ngIf="isLoggedIn"
          class="btn btn-outline-danger rounded-pill"
          (click)="logout()"
        >
          <i class="bi bi-box-arrow-right me-1"></i>{{ "LOGOUT" | translate }}
        </button>

        <!-- Login -->
        <button
          *ngIf="!isLoggedIn"
          class="btn btn-outline-dark rounded-pill"
          routerLink="/login"
        >
          <i class="bi bi-person-circle me-1"></i>{{ "LOGIN" | translate }}
        </button>

        <!-- Language Switch -->
      </ng-container>
      <button
        class="btn-toggle-lang"
        (click)="toggleLang()"
        *ngIf="showLangButton"
      >
        {{ currentLang === "en" ? "العربية" : "English" }}
      </button>
    </div>
  </div>
</header>
