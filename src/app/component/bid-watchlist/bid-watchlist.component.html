<div class="watchlist-page">

  <div class="watchlist-container">
    <button class="back-btn2" (click)="goBack()">
      <img src="back.png" alt="Back to Bidding" class="back-btn-image" />
    </button>
  
  <h2 class="watchlist-title">My Watchlist</h2>
  
  <div class="wishlist-tabs">
    <!-- <button
      [class.active-tab]="selectedTab === 'auction'"
      (click)="selectedTab = 'auction'"
    >
    Auctions
  </button>
  <button
      [class.active-tab]="selectedTab === 'direct'"
      (click)="selectedTab = 'direct'"
    >
      Direct Sale
    </button> -->
    <ul class="nav nav-tabs bid-tabs">
  <li class="nav-item">
    <a
      class="nav-link"
      [class.active]="selectedTab === 'auction'"
      (click)="switchTab('auction')"
      href="javascript:void(0)"
    >
      Auctions
    </a>
  </li>
  <li class="nav-item">
    <a
      class="nav-link"
      [class.active]="selectedTab === 'direct'"
      (click)="switchTab('direct')"
      href="javascript:void(0)"
    >
      Direct Sale
    </a>
  </li>
</ul>

  </div>
</div>

<div class="bid-controls">
  <div class="view-toggle">
    <i class="fa fa-th-large" [class.active]="isGridView" (click)="isGridView = true"></i>
    <i class="fa fa-list" [class.active]="!isGridView" (click)="isGridView = false"></i>
  </div>
</div>

<div class="cart-grid" *ngIf="isGridView">
  <!-- <div class="cart-card" *ngFor="let asset of watchlistAssets"> -->
  <div class="cart-card" *ngFor="let asset of filteredWatchlistAssets">
    <div class="cart-image-wrap">
      <img
        *ngIf="asset.thumbnailUrl?.length"
        [src]="asset.thumbnailUrl"
        alt="Asset Image"
        class="cart-image"
      />
    </div>

    <div class="cart-content">
      <div class="cart-title">{{ asset.title }}</div>
      <div class="cart-number">Asset #{{ asset.assetNumber }}</div>
      <!-- <div class="cart-info">BAHRAIN</div> -->

      <div class="cart-bottom-row">
        <div class="price">BHD {{ asset.price }}</div>
        
        <div class="cart-actions">
          <button
            class="icon-btn"
            title="Remove from wishlist"
            (click)="removeFromWatchlist(asset)"
          >
            <img src="trash.png" class="button-image1" />
          </button>
          <button
          class="icon-btn"
            [title]="
              isInCart(asset.assetId) ? 'Already in Cart' : 'Add to Cart'
            "
            (click)="addToCart(asset.assetId)"
            [disabled]="isInCart(asset.assetId)"
          >
            <img
              [src]="isInCart(asset.assetId) ? 'cart-added.png' : 'sell.png'"
              alt="Cart Toggle"
              class="button-image2"
            />
            <!-- <img src="addtocart.png" class="button-image2" /> -->
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

 <div *ngIf="!isGridView" class="watchlist-list">
    <div class="watchlist-list-card" *ngFor="let asset of filteredWatchlistAssets">
      <img [src]="asset.thumbnailUrl" class="watchlist-list-image" />

      <div class="watchlist-list-content">
        <div class="cart-title">{{ asset.title }}</div>
        <div class="cart-number">Asset #{{ asset.assetNumber }}</div>
        <div class="price">BHD {{ asset.price }}</div>
      </div>

      <div class="watchlist-actions">
        <button class="icon-btn" (click)="removeFromWatchlist(asset)">
          <img src="trash.png" class="button-image1" />
        </button>

        <button
          class="icon-btn"
          (click)="addToCart(asset.assetId)"
          [disabled]="isInCart(asset.assetId)"
        >
          <img
            [src]="isInCart(asset.assetId) ? 'cart-added.png' : 'sell.png'"
            class="button-image2"
          />
        </button>
      </div>
    </div>
  </div>

<!-- Toast container -->
<div class="toast-container p-3" style="z-index: 9999">
  <div
    #liveToast
    class="toast"
    role="alert"
    aria-live="assertive"
    aria-atomic="true"
    data-bs-delay="4000"
    >
    <div class="toast-header bg-info text-white">
      <strong class="me-auto">Notification</strong>
      <small class="text-muted">Just now</small>
      <button
      type="button"
      class="btn-close btn-close-white ms-2 mb-1"
        data-bs-dismiss="toast"
        aria-label="Close"
      ></button>
    </div>
    <div class="toast-body">This is a toast message.</div>
  </div>
</div>

</div>
