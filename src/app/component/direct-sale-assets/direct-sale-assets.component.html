<div class="Grid-container" [class.filter-open]="isFilterOpen">
  <div *ngIf="isFilterOpen" class="filter-modal-overlay">
    <div class="filter-modal">
      <button class="modal-close-btn" (click)="toggleFilter()">×</button>
      <h3 class="modal-title">Filter</h3>
      <div class="modal-section">
        <label for="sortBy" class="modal-label">Sort By</label>
        <select id="sortBy" class="modal-select" [(ngModel)]="selectedSort" (change)="onSortByChange()">
            <option value="" disabled selected>Select Sort Option</option>
            <option value="price_desc">Price: Highest - Lowest</option>
            <option value="price_asc">Price: Lowest - Highest</option>
        </select>

      </div>
      <div class="modal-section">
        <label class="modal-label">Price</label>
        <div class="modal-slider-row">
          <span class="modal-price">{{ minPrice }}</span>
          <input type="range" min="{{ minPrice }}" max="{{ maxPrice }}" [(ngModel)]="selectedMinPrice" (input)="onPriceSliderChange()" class="modal-slider" [style.background]="getPriceSliderBackground()">
          <span class="modal-price">{{ maxPrice }}</span>
        </div>
      </div>
      <button class="modal-apply-btn" (click)="applyModalFilter()">Apply Filter</button>
      <button class="modal-clear-btn" (click)="clearModalFilter()">Clear Filter</button>
    </div>
  </div>

  <div class="top-toolbar">
    <div class="toolbar-left">
        <button class="back-btn" (click)="goBack()">
          <img
            src="back.png"
            alt="Back to Bidding"
            class="back-btn-image"
            [class.rtl-rotate]="isRtl"
          />
        </button>
    </div>

    <div class="search-box">
      <input 
        type="text" 
        [(ngModel)]="searchQuery" 
        (input)="onSearchInput()"
        placeholder="Search Asset..."
        class="search-input"
      >
      <button class="search-button" (click)="filterAssetsBySearch()">
        <i class="bi bi-search"></i>
      </button>
    </div>
    <button class="btn filter-btn-icon ms-2" (click)="toggleFilter()" title="Filter">
      <svg width="43" height="34" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="4" y="7" width="16" height="2" rx="1" fill="currentColor"/>
        <rect x="6" y="11" width="12" height="2" rx="1" fill="currentColor"/>
        <rect x="8" y="15" width="8" height="2" rx="1" fill="currentColor"/>
      </svg>
      <span class="filter-tooltip">Apply Filter</span>
    </button>
    <!-- <div class="category-icons d-flex flex-wrap gap-2">
      <div
        *ngFor="let category of categories"
        [ngClass]="{
          'active-category': isActive(category.id),
          'category-icon': true
        }"
        class="p-2 rounded shadow-sm text-center"
      >
        <img
          [src]="category.icon"
          alt="{{ category.name }}"
          class="mb-1"
          width="40"
          height="40"
        />
        <div>{{ category.name }}</div>
      </div>
    </div> -->
    <app-category-selector
      [routePrefix]="'direct-sale-assets'"
    ></app-category-selector>


    <div class="toolbar-right">
      <img
        [src]="layoutType === 'grid' ? 'grid1.png' : 'view-list.png'"
        alt="Toggle View"
        class="toolbar-icon grid"
        (click)="toggleLayout()"
      />

      <button
        class="btn btn-outline-success me-2"
        type="button"
        (click)="toOrders()"
      >
        <i class="bi bi-cart"></i> Orders
      </button>
      <button
        class="btn btn-outline-success me-2"
        type="button"
        (click)="toCart()"
      >
        <i class="bi bi-cart"></i> Cart
      </button>

      <button
        class="btn btn-outline-primary me-2"
        type="button"
        (click)="toWatchlist()"
      >
        <i class="bi bi-bookmark-heart"></i> Watchlist
      </button>
    </div>
  </div>
  <div *ngIf="noAssetsFound" class="text-center text-muted py-4">
    <p>No direct sale assets found in this category.</p>
  </div>
  <div
    *ngIf="!noAssetsFound"
    class="plates-container"
    [ngClass]="layoutType + '-view'"
  >
    <div class="plate-card" *ngFor="let asset of assets">
      <div class="plate-display" (click)="goToAssetDetail(asset.assetId)">
        <ng-container *ngIf="layoutType === 'row'; else gridView">
          <!-- Row View -->
          <div class="plate-display-row">
            <img
              [src]="
                asset.galleries?.length
                  ? environment.baseurl + asset.galleries[0]?.filePath
                  : 'default.jpg'
              "
              alt="Asset Image"
              class="plate-main-image"
              (click)="goToAssetDetail(asset.assetId)"
            />
            <div class="plate-name-view">
              <span class="plate-name-text">{{ asset.title }}</span>
              <!-- <span class="plate-name-text">{{ asset.description }}</span> -->
            </div>

            <div class="plate-footer">
              <div class="icons icons-top">
                <button
                  class="icon-btn-1 icon-btn"
                  [title]="
                    isInWishlist(asset.assetId)
                      ? 'Remove from Wishlist'
                      : 'Add to Wishlist'
                  "
                  (click)="toggleWishlist(asset.assetId); $event.stopPropagation()"
                >
                  <img
                    [src]="
                      isInWishlist(asset.assetId)
                        ? 'bookmark.png'
                        : 'wishlist.png'
                    "
                    alt="Wishlist Toggle"
                    class="button-image1"
                    [ngClass]="{
                      'active-wishlist': isInWishlist(asset.assetId)
                    }"
                  />
                </button>

                <ng-container *ngIf="isInCart(asset.assetId); else notInCart">
                  <button
                    class="icon-btn-1 icon-btn"
                    title="Already in Cart"
                    (click)="redirectToCart()"
                  >
                    <img src="c.png" alt="Cart Toggle" class="button-image2" />
                  </button>
                </ng-container>

                <ng-template #notInCart>
                  <button
                    class="icon-btn-1 icon-btn"
                    title="Add to Cart"
                    (click)="addToCart(asset.assetId); $event.stopPropagation()"
                  >
                    <img
                      src="sell.png"
                      alt="Cart Toggle"
                      class="button-image2"
                    />
                  </button>
                </ng-template>
              </div>
            </div>
          </div>
          <div class="price">BHD {{ asset.price }}</div>
        </ng-container>

        <ng-template #gridView>
          <!-- Grid View -->
          <img
            [src]="
              asset.galleries?.length
                ? environment.baseurl + asset.galleries[0]?.filePath
                : 'default.jpg'
            "
            alt="Asset Image"
            class="plate-main-image"
            (click)="goToAssetDetail(asset.assetId)"
          />
          <div class="icons icons-top">
            <button
              class="icon-btn"
              [title]="
                isInWishlist(asset.assetId)
                  ? 'Remove from Wishlist'
                  : 'Add to Wishlist'
              "
              (click)="toggleWishlist(asset.assetId); $event.stopPropagation()"
            >
              <img
                [src]="
                  isInWishlist(asset.assetId) ? 'bookmark.png' : 'wishlist.png'
                "
                alt="Wishlist Toggle"
                class="button-image1"
                [ngClass]="{ 'active-wishlist': isInWishlist(asset.assetId) }"
              />
            </button>

            <ng-container *ngIf="isInCart(asset.assetId); else notInCart">
              <button
                class="icon-btn-1 icon-btn"
                title="Already in Cart"
                (click)="redirectToCart()"
              >
                <img src="c.png" alt="Cart Toggle" class="button-image2" />
              </button>
            </ng-container>

            <ng-template #notInCart>
              <button
                class="icon-btn-1 icon-btn"
                title="Add to Cart"
                (click)="addToCart(asset.assetId); $event.stopPropagation()"
              >
                <img src="sell.png" alt="Cart Toggle" class="button-image2" />
              </button>
            </ng-template>
          </div>

          <div class="plate-name full-width">
            <span class="plate-name-text">{{ asset.title }}</span>
          </div>

          <div class="price1">BHD {{ asset.price }}</div>
        </ng-template>
      </div>
    </div>
  </div>

  <!-- Toast container -->
  <div class="toast-container p-3" style="z-index: 9999">
    <div
      #liveToast
      class="toast"
      role="alert"
      aria-live="assertive"
      aria-atomic="true"
      data-bs-delay="4000"
    >
      <div class="toast-header bg-info text-white">
        <strong class="me-auto">Notification</strong>
        <small class="text-muted">Just now</small>
        <button
          type="button"
          class="btn-close btn-close-white ms-2 mb-1"
          data-bs-dismiss="toast"
          aria-label="Close"
        ></button>
      </div>
      <div class="toast-body">This is a toast message.</div>
    </div>
  </div>
</div>
