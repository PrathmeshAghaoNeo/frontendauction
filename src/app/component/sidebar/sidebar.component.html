<nav class="modern-sidebar" [class.expanded]="isExpanded">
  <div class="sidebar-inner" (mouseenter)="onMouseEnter()" (mouseleave)="onMouseLeave()">
    <ul>
      <li *ngFor="let item of visibleMenuItems" class="sidebar-item">
        <a [routerLink]="item.route" routerLinkActive="active">
          <i [class]="item.icon"></i>
          <span class="label" *ngIf="isExpanded">{{ item.label }}</span>
        </a>
      </li>
    </ul>
  </div>
</nav>
