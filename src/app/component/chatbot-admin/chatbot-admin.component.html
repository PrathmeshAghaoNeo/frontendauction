<div class="container mt-4">
  <!-- Heading -->
  <h2 class="mb-4 fw-bold text-primary">Chatbot FAQ Admin Panel</h2>

  <div class="d-flex justify-content-between align-items-center mb-3">
    <!-- Search Bar -->
    <div class="input-group w-50">
      <input type="text" class="form-control" placeholder="Search FAQs..." [(ngModel)]="searchTerm" (ngModelChange)="onSearch()">
      <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
    </div>
    <!-- Add FAQ Button -->
    <button class="btn btn-primary" (click)="openAddModal()">
      <i class="bi bi-plus-lg"></i> Add New FAQ
    </button>
  </div>

  <!-- FAQ List -->
  <div *ngFor="let faq of paginatedFaqs()" class="faq-row d-flex align-items-center justify-content-between bg-light rounded mb-2 p-3">
    <div class="d-flex align-items-center faq-question-area">
      <i class="bi bi-file-earmark-text me-2 text-primary"></i>
      <span class="faq-question-text">{{ faq.question }}</span>
    </div>
    <div class="d-flex gap-2">
      <button class="faq-action-btn view" (click)="openViewModal(faq)">
        <i class="bi bi-eye"></i>
      </button>
      <button class="faq-action-btn edit" (click)="openEditModal(faq)">
        <i class="bi bi-pencil"></i>
      </button>
      <button class="faq-action-btn delete" (click)="deleteFaq(faq.id)">
        <i class="bi bi-trash"></i>
      </button>
    </div>
  </div>

  <!-- Pagination -->
  <nav *ngIf="filteredFaqs.length > pageSize" class="mt-4">
    <ul class="pagination justify-content-start">
      <li class="page-item" [class.disabled]="currentPage === 1">
        <a class="page-link" href="#" (click)="goToPage(currentPage - 1)">&laquo; Previous</a>
      </li>
      <li class="page-item" *ngFor="let page of totalPagesArray(); let i = index" [class.active]="currentPage === (i+1)">
        <a class="page-link" href="#" (click)="goToPage(i+1)">{{ i+1 }}</a>
      </li>
      <li class="page-item" [class.disabled]="currentPage === totalPages()">
        <a class="page-link" href="#" (click)="goToPage(currentPage + 1)">Next &raquo;</a>
      </li>
    </ul>
  </nav>

  <!-- View Modal -->
  <div class="modal fade" id="viewModal" tabindex="-1" aria-labelledby="viewModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header" style="background: #bca4e6;">
          <h5 class="modal-title text-white" id="viewModalLabel">FAQ Details</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" (click)="closeViewModal()"></button>
        </div>
        <div class="modal-body">
          <div class="row">
            <div class="col-md-6">
              <p><span class="fw-bold text-primary">Question:</span><br>{{ viewFaqObj?.question }}</p>
              <p><span class="fw-bold text-primary">Category:</span><br>{{ viewFaqObj?.category }}</p>
            </div>
            <div class="col-md-6">
              <p><span class="fw-bold text-primary">Answer:</span><br>{{ viewFaqObj?.answer }}</p>
              <p><span class="fw-bold text-primary">Tags:</span><br>{{ viewFaqObj?.tags }}</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Add/Edit Modal -->
  <div class="modal fade" id="faqModal" tabindex="-1" aria-labelledby="faqModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="faqModalLabel">{{ isEditing ? 'Edit FAQ' : 'Add FAQ' }}</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" (click)="closeModal()"></button>
        </div>
        <form (ngSubmit)="saveFaq()">
          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label">Question</label>
              <input class="form-control" [(ngModel)]="formFaq.question" name="question" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Answer</label>
              <textarea class="form-control" [(ngModel)]="formFaq.answer" name="answer" required></textarea>
            </div>
            <div class="mb-3">
              <label class="form-label">Category</label>
              <input class="form-control" [(ngModel)]="formFaq.category" name="category" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Tags</label>
              <input class="form-control" [(ngModel)]="formFaq.tags" name="tags">
            </div>
          </div>
          <div class="modal-footer">
            <button class="btn btn-success" type="submit">{{ isEditing ? 'Update' : 'Add' }}</button>
            <button class="btn btn-secondary" type="button" data-bs-dismiss="modal" (click)="closeModal()">Cancel</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
